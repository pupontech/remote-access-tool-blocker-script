name: powershell-ci

# Static/synthetic gates only: never installs an App Control policy on a runner.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-only:
    name: Windows App Control (${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Print engine version
        run: $PSVersionTable | Out-String
      - name: Parse and encoding audit
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1', '.bat' })
          foreach ($f in $files) {
            $bytes = [IO.File]::ReadAllBytes($f.FullName)
            if (@($bytes | Where-Object { $_ -gt 127 -or ($_ -lt 32 -and $_ -notin 9,10,13) }).Count) {
              throw "Non-ASCII/control byte in $($f.FullName)"
            }
            if ($f.Extension -eq '.bat') {
              $text = [Text.Encoding]::ASCII.GetString($bytes)
              if ($text.Replace("`r`n", '').Contains("`n")) { throw "Bare LF in $($f.Name)" }
            } else {
              $tokens = $null; $errors = $null
              [Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count) { throw ($errors | Out-String) }
            }
          }
      - name: Windows-only scope and integration regressions
        run: |
          python tests/test_windows_only_repository.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/Test-ScriptIntegration.ps1
          ./tests/Test-WindowsOnlyRecovery.ps1
      - name: Policy inventory
        run: |
          $files = @(Get-ChildItem policy/variants -Filter '*.cip' -File)
          if ($files.Count -ne 32) { throw 'Expected 32 compiled variants' }
          foreach ($mode in 'Enforce', 'Audit') {
            foreach ($t in 0,1) { foreach ($a in 0,1) { foreach ($s in 0,1) { foreach ($r in 0,1) {
              $name = 'RmmBlock-{0}-T{1}A{2}S{3}R{4}' -f $mode,$t,$a,$s,$r
              foreach ($ext in 'cip','xml') {
                if (-not (Test-Path -LiteralPath "policy/variants/$name.$ext")) { throw "Missing $name.$ext" }
              }
            } } } }
          }
      - name: Build Windows-only packages
        shell: bash
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            choco install zip -y --no-progress
            export PATH="$PATH:/c/ProgramData/chocolatey/bin"
          fi
          ./build/build-release.sh
          ./build/build-script-integration.sh
      - name: Verify GUI package against committed source
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          python tests/verify-release-source.py "dist/remote-tools-block-windows-$version.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows-only preview kits
        if: matrix.shell == 'pwsh'
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-control-test-kits
          path: |
            dist/remote-tools-block-windows-*.zip*
            dist/remote-access-tool-blocker-script-only-*.zip*
